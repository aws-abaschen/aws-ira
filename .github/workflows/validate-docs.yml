name: Validate documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: OKF and Mermaid validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install validation dependencies
        run: |
          python -m pip install -r scripts/requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Test the document validator
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Validate OKF documents and examples
        run: python scripts/validate_docs.py

      - name: Validate embedded Mermaid and icon references
        run: npm run validate:diagrams
